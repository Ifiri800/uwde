services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: uwde-backend:0.1.1
    container_name: uwde-backend

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

    environment:
      ENVIRONMENT: development
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: uwde-frontend:0.1.1
    container_name: uwde-frontend

    read_only: true

    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128

    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
